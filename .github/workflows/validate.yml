name: Validate submissions

# Runs on every pull request, including from forks. No secrets are used and nothing is signed, which
# is deliberate: this is the review gate (design doc §5.4), and a gate that only works for
# maintainers is not a gate.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4

      # The validator IS the client's validator (electron/plugins/manifest.mjs). Vendoring a copy
      # here would let the two drift, and then "strict mode passed" would stop meaning "clients will
      # accept this" — which is the entire value of validating at review time.
      # Which app version? Not `main` — see _app-checkout.md. Validating against unreleased code
      # would accept manifests that every shipped client skips, with a green check to say otherwise.
      - name: Resolve app ref
        id: app
        env:
          APP_REF: ${{ vars.APP_REF }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$APP_REF" ]; then
            echo "ref=$APP_REF" >> "$GITHUB_OUTPUT"
            echo "pinned to $APP_REF via the APP_REF variable"
            exit 0
          fi
          ref="$(gh release view --repo zeraix/zeraix --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$ref" ]; then
            echo "::error::could not resolve the latest zeraix/zeraix release. Set the APP_REF variable to a tag."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "using the latest app release: $ref"

      - name: Checkout app (for the shared validator)
        uses: actions/checkout@v4
        with:
          repository: zeraix/zeraix
          ref: ${{ steps.app.outputs.ref }}
          path: .app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A missing validator means the app release predates the plugin schema — a MODULE_NOT_FOUND
      # stack trace does not say that, and this is the first thing anyone will hit.
      - name: Check the shared validator is present
        run: |
          if [ ! -f .app/electron/plugins/manifest.mjs ]; then
            echo "::error::${{ steps.app.outputs.ref }} of zeraix/zeraix has no electron/plugins/manifest.mjs,"
            echo "::error::so there is nothing to validate submissions against."
            echo "::error::"
            echo "::error::Unblock now — point the checkout at a ref that has the schema:"
            echo "::error::  gh variable set APP_REF --body main --repo ${{ github.repository }}"
            echo "::error::  (or Settings -> Secrets and variables -> Actions -> Variables -> APP_REF = main)"
            echo "::error::"
            echo "::error::Then undo it: once a zeraix/zeraix release contains the schema, delete APP_REF so"
            echo "::error::the checkout goes back to the latest release. Validating against main accepts"
            echo "::error::manifests that shipped clients skip — see .github/workflows/_app-checkout.md."
            echo "::error::"
            echo "::error::This does not fall back to main on its own, and does not skip validation: feeds"
            echo "::error::are unsigned, so review is the only gate, and a green check that checked nothing"
            echo "::error::is worse than a red one."
            exit 1
          fi

      # Checks only. Nothing is built here and nothing is built anywhere in this repo: a plugin is a
      # committed directory, and assembling the catalogue is the publish endpoint's job. This step
      # exists to fail a submission a client would reject, while a human is still looking at it.
      #
      # The reserved-publisher gate is keyed on where the pull request came from: a fork may not
      # claim "zeraix", and a branch on this repo is a maintainer publishing an official plugin and
      # may. A fork cannot influence this value — Actions computes it, it is not read from the
      # submission.
      - name: Validate submissions
        env:
          FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FROM_FORK" = "true" ]; then
            node .github/scripts/validate-submissions.mjs --root . --app .app
          else
            node .github/scripts/validate-submissions.mjs --root . --app .app --allow-reserved
          fi
