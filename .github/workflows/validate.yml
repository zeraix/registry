name: Validate submissions

# Runs on every pull request, including from forks. No secrets are used and nothing is signed, which
# is deliberate: this is the review gate (design doc §5.4), and a gate that only works for
# maintainers is not a gate.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4

      # One file is borrowed from the app repo: electron/plugins/manifest.mjs, the client's own
      # validator. Vendoring a copy here would let the two drift, and then "strict mode passed" would
      # stop meaning "clients will accept this" — which is the entire value of validating at review
      # time.
      #
      # Tracks `main`. There is deliberately no version resolution: which release a user happens to
      # run is not something this repo can know or should encode, and pinning to the newest release
      # only made CI *stricter* than the schema — it rejected manifests newer clients accept, while
      # older clients already handle anything they do not recognise by skipping it (design doc §7).
      - name: Checkout app (for the shared validator)
        uses: actions/checkout@v4
        with:
          repository: zeraix/zeraix
          ref: main
          path: .app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A MODULE_NOT_FOUND stack trace would not say which file was missing or why it matters.
      - name: Check the shared validator is present
        run: |
          if [ ! -f .app/electron/plugins/manifest.mjs ]; then
            echo "::error::zeraix/zeraix main has no electron/plugins/manifest.mjs, so there is nothing"
            echo "::error::to validate submissions against. It was moved, renamed, or never pushed."
            echo "::error::"
            echo "::error::Validation is not skipped when the validator is missing: feeds are unsigned,"
            echo "::error::so review is the only gate, and a green check that checked nothing is worse"
            echo "::error::than a red one."
            exit 1
          fi

      # Checks only. Nothing is built here and nothing is built anywhere in this repo: a plugin is a
      # committed directory, and assembling the catalogue is the publish endpoint's job. This step
      # exists to fail a submission a client would reject, while a human is still looking at it.
      #
      # The reserved-publisher gate is keyed on where the pull request came from: a fork may not
      # claim "zeraix", and a branch on this repo is a maintainer publishing an official plugin and
      # may. A fork cannot influence this value — Actions computes it, it is not read from the
      # submission.
      - name: Validate submissions
        env:
          FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FROM_FORK" = "true" ]; then
            node .github/scripts/validate-submissions.mjs --root . --app .app
          else
            node .github/scripts/validate-submissions.mjs --root . --app .app --allow-reserved
          fi
