name: Publish feeds

# Merging is publishing (design doc §5.4). This builds the index and kill-list and uploads them to
# the API origin the app fetches from.
#
# Nothing is signed: this repo's review history is the provenance (§5.1). The consequence is worth
# being explicit about — write access to this repo, or to the publish endpoint, is write access to
# what the marketplace offers. What it does not grant is the ability to alter a plugin's bytes
# without also changing its entry here, because the index pins every artifact by sha512 and clients
# verify before writing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4

      # Which app version? Not `main` — see _app-checkout.md. Validating against unreleased code
      # would accept manifests that every shipped client skips, with a green check to say otherwise.
      - name: Resolve app ref
        id: app
        env:
          APP_REF: ${{ vars.APP_REF }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$APP_REF" ]; then
            echo "ref=$APP_REF" >> "$GITHUB_OUTPUT"
            echo "pinned to $APP_REF via the APP_REF variable"
            exit 0
          fi
          ref="$(gh release view --repo zeraix/zeraix --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$ref" ]; then
            echo "::error::could not resolve the latest zeraix/zeraix release. Set the APP_REF variable to a tag."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "using the latest app release: $ref"

      - name: Checkout app (shared validator + builder + built-in skills)
        uses: actions/checkout@v4
        with:
          repository: zeraix/zeraix
          ref: ${{ steps.app.outputs.ref }}
          path: .app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A missing builder means the app release predates the plugin tooling — a MODULE_NOT_FOUND
      # stack trace does not say that, and this is the first thing anyone will hit.
      - name: Check the shared tooling is present
        run: |
          if [ ! -f .app/scripts/build-registry-index.mjs ]; then
            echo "::error::${{ steps.app.outputs.ref }} of zeraix/zeraix has no scripts/build-registry-index.mjs."
            echo "::error::That release predates the plugin tooling. Ship a release containing it, or set"
            echo "::error::the APP_REF variable to a ref that has it."
            exit 1
          fi

      # Regenerate the built-in skills as zeraix/* plugins. They are gitignored here so there is one
      # copy of each skill (in the app repo) and the two cannot drift.
      - name: Materialize built-in skills
        run: node .app/scripts/export-builtin-skills.mjs --out .

      # A manifest problem should fail before anything is built or uploaded.
      #
      # --allow-reserved because this runs on merged main: it has just materialized the official
      # built-in skills as plugins/zeraix/*, and the hand-authored official plugins beside them were
      # already reviewed on the way in (validate.yml refuses a reserved publisher from a fork).
      - name: Validate everything
        run: node .app/scripts/build-registry-index.mjs --root . --check --allow-reserved

      # Bootstrap vs misconfigured — a distinction worth making, because they deserve opposite
      # outcomes. Before the publish origin exists, validation-only is the honest result and a red X
      # on every merge would just train everyone to ignore this workflow. Half-configured is
      # dangerous instead: feeds built with real artifact URLs that go nowhere look exactly like a
      # successful publish from the outside. That fails loudly.
      - name: Assess publish configuration
        id: cfg
        env:
          PLUGIN_BASE_URL: ${{ vars.PLUGIN_BASE_URL }}
          PUBLISH_URL: ${{ vars.PUBLISH_URL }}
        run: |
          if [ -z "$PLUGIN_BASE_URL" ] && [ -z "$PUBLISH_URL" ]; then
            echo "::notice::No publish origin configured — validated $(ls -d plugins/*/* 2>/dev/null | wc -l) plugin(s) and stopped."
            echo "::notice::To publish: stand up the publish endpoint, then set the PLUGIN_BASE_URL and"
            echo "::notice::PUBLISH_URL variables and the PUBLISH_TOKEN secret. See the README checklist."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PLUGIN_BASE_URL" ]; then
            echo "::error::PUBLISH_URL is set but PLUGIN_BASE_URL is not, so the index would carry no"
            echo "::error::usable artifact URLs. Set both, or neither."
            exit 1
          fi
          if [ -z "$PUBLISH_URL" ]; then
            echo "::error::PLUGIN_BASE_URL is set but PUBLISH_URL is not. Feeds would be built with real"
            echo "::error::artifact URLs and uploaded nowhere — indistinguishable from a successful publish."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build feeds
        if: steps.cfg.outputs.publish == 'true'
        env:
          # Where plugin artifacts are served from; the index derives per-plugin URLs beneath it.
          PLUGIN_BASE_URL: ${{ vars.PLUGIN_BASE_URL }}
        run: |
          # --sequence is NOT optional here. dist/ is gitignored, so a fresh checkout has no previous
          # build to count from and the builder would emit sequence 1 on every publish — a number
          # that never advances is a client-side rollback check that never fires. run_number survives
          # the checkout and only ever climbs.
          node .app/scripts/build-registry-index.mjs --root . --allow-reserved \
            --base-url "$PLUGIN_BASE_URL" --sequence "${{ github.run_number }}"

      # Feeds and artifacts are served from our own API origin (design doc §5.2) — no object storage.
      # The registry repo stays the source of truth; this is the mirror that makes it reachable from
      # networks where raw GitHub is not.
      #
      # TODO: this endpoint does not exist yet. It needs to accept dist/{index,killlist}.json plus
      # the plugin files under plugins/**/files/, and serve them at
      #   <api origin>/plugins/{index,killlist}.json
      #   <PLUGIN_BASE_URL>/<publisher>/<name>/<version>/<file>
      # Since the feeds are unsigned, this endpoint IS the integrity boundary for the catalogue:
      # whatever it serves is what clients believe. Artifacts remain hash-pinned by the index.
      - name: Upload to the API origin
        if: steps.cfg.outputs.publish == 'true'
        env:
          PUBLISH_URL: ${{ vars.PUBLISH_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          echo "::error::The publish endpoint is not implemented yet. Wire this step to $PUBLISH_URL."
          exit 1

      - name: Upload feeds as an artifact
        if: steps.cfg.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: registry-feeds
          path: dist/
          if-no-files-found: error
          retention-days: 30
