name: Validate and publish

# Merging is publishing (design doc §5.4). This validates the committed plugins and uploads them to
# the publish endpoint, which is what assembles the catalogue the app fetches. Nothing is built here.
#
# Named for what it does in BOTH states, not the happy one. Until an endpoint is configured this job
# validates and stops — green, having changed nothing a user can see. A job called "Publish feeds"
# going green in that state reads as "the marketplace updated", which is how a repo ends up believing
# it shipped something it never sent anywhere.
#
# Nothing is signed: this repo's review history is the provenance (§5.1). The consequence is worth
# being explicit about — write access to this repo, or to the publish endpoint, is write access to
# what the marketplace offers. What it does not grant is the ability to alter a plugin's bytes
# without also changing its entry here, because the index pins every artifact by sha512 and clients
# verify before writing.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The feeds are committed build output (see the build step), so this job pushes to main.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4

      # Two things are borrowed from the app repo: electron/plugins/manifest.mjs (the client's own
      # validator, so the two cannot drift) and scripts/export-builtin-skills.mjs.
      #
      # Tracks `main`. There is deliberately no version resolution — see validate.yml.
      - name: Checkout app (shared validator + built-in skills)
        uses: actions/checkout@v4
        with:
          repository: zeraix/zeraix
          ref: main
          path: .app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A MODULE_NOT_FOUND stack trace would not say which file was missing or why it matters.
      - name: Check the shared validator is present
        run: |
          if [ ! -f .app/electron/plugins/manifest.mjs ]; then
            echo "::error::zeraix/zeraix main has no electron/plugins/manifest.mjs, so there is nothing"
            echo "::error::to validate submissions against. It was moved, renamed, or never pushed."
            echo "::error::"
            echo "::error::Validation is not skipped when the validator is missing: feeds are unsigned,"
            echo "::error::so review is the only gate, and a green check that checked nothing is worse"
            echo "::error::than a red one."
            exit 1
          fi

      # Regenerate the built-in skills as zeraix/* plugins. They are gitignored here so there is one
      # copy of each skill (in the app repo) and the two cannot drift.
      - name: Materialize built-in skills
        run: node .app/scripts/export-builtin-skills.mjs --out .

      # Re-check on merged main before anything is uploaded. --allow-reserved because this has just
      # materialized the official built-in skills as plugins/zeraix/*, and the hand-authored official
      # plugins beside them were already reviewed on the way in (validate.yml refuses a reserved
      # publisher from a fork).
      - name: Validate everything
        run: node .github/scripts/validate-submissions.mjs --root . --app .app --allow-reserved

      # dist/ IS the origin today. The app's NEXT_PUBLIC_PLUGIN_ORIGIN points at
      # raw.githubusercontent.com/zeraix/registry/main/dist, which can serve nothing but committed
      # bytes, so the catalogue is rebuilt from the validated tree and pushed back on every merge.
      # When the publish endpoint below exists, this same script feeds it and dist/ stops being
      # tracked -- the builder does not change, only where its output goes.
      #
      # AFTER validation, deliberately: the strict gate runs first, so nothing reaches the catalogue
      # that review would have refused.
      #
      # The built-in skills materialized above are gitignored and therefore left out of the feed —
      # they are not committed, so a raw.githubusercontent URL for them would resolve to nothing and
      # publish an entry no user can install. `--include-generated` is the flip for when the
      # marketplace replaces the app's built-in set (design doc §9 phase 1).
      - name: Build the feeds
        run: node .github/scripts/build-feeds.mjs --root . --app .app

      # The builder rewrites nothing when the catalogue is unchanged, so most merges reach this step
      # with a clean dist/ and commit nothing.
      #
      # `[skip ci]` is what breaks the loop: this workflow triggers on push to main, and the push
      # below is a push to main. The no-change guard would stop the second run doing any damage, but
      # every merge would still cost two runs, one of which exists only to discover it is redundant.
      - name: Commit the feeds
        run: |
          if git diff --quiet -- dist; then
            echo "::notice::The catalogue is unchanged — no feed was rewritten and nothing was committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A merge landing while this ran makes the push non-fast-forward. The feeds are DERIVED, so
          # the fix is never to merge two versions of them — it is to rebuild on whatever main now
          # says and try again. Rebasing instead would ask git to reconcile two generated documents,
          # and the winner of that would be decided by conflict markers rather than by the tree.
          for attempt in 1 2 3; do
            git add dist
            git commit -q -m "Rebuild the plugin feeds [skip ci]" -m "Built from ${GITHUB_SHA} by .github/workflows/publish.yml."
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Could not push the rebuilt feeds after 3 attempts — main is moving faster"
              echo "::error::than this job can rebuild. The catalogue is now behind the tree; re-run this"
              echo "::error::workflow once merges settle."
              exit 1
            fi
            echo "::notice::main moved while building — rebuilding the feeds on the new tip (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
            node .github/scripts/build-feeds.mjs --root . --app .app
            if git diff --quiet -- dist; then
              echo "::notice::The newer main already carries this catalogue — nothing left to commit."
              exit 0
            fi
          done
          {
            echo "## ✅ Catalogue updated"
            echo
            echo "\`dist/plugins/\` was rebuilt from the committed tree and pushed to \`main\`. Clients"
            echo "fetching the raw origin pick it up on their next refresh — this one **did** change what"
            echo "users see."
            echo
            echo "<sub>Artifact digests are computed from the committed blobs, which is what the origin"
            echo "serves; the builder refuses to publish a digest taken from a modified working tree.</sub>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Bootstrap vs misconfigured — a distinction worth making, because they deserve opposite
      # outcomes. Before the publish endpoint exists, validation-only is the honest result and a red X
      # on every merge would just train everyone to ignore this workflow.
      - name: Assess publish configuration
        id: cfg
        env:
          PUBLISH_URL: ${{ vars.PUBLISH_URL }}
        run: |
          if [ -z "$PUBLISH_URL" ]; then
            echo "::notice::No publish endpoint configured — the feeds were served from dist/ instead."
            {
              echo "## ℹ️ Published to \`dist/\`, not to an endpoint"
              echo
              echo "The manifests validated and the feeds were rebuilt and committed above, which is how"
              echo "the catalogue reaches users today: the app fetches \`dist/plugins/\` from the raw"
              echo "GitHub origin. No \`PUBLISH_URL\` is configured, so nothing was uploaded anywhere else."
              echo
              echo "That arrangement is a stopgap — it puts the integrity of every install behind a host"
              echo "this repo does not control, and raw GitHub is unreachable from mainland China."
              echo
              echo "To publish properly:"
              echo
              echo "1. Stand up the publish endpoint — it owes the client artifact digests, one document"
              echo "   embedding every manifest, and a monotonic feed sequence. See the README checklist."
              echo "2. Set the \`PUBLISH_URL\` variable and the \`PUBLISH_TOKEN\` secret."
              echo "3. Point \`NEXT_PUBLIC_PLUGIN_ORIGIN\` at it, stop tracking \`dist/\`, and ship a release."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # Upload the committed tree. There is no build step: this repo holds plugins as directories,
      # and the endpoint is what turns them into a catalogue (design doc §5.2, §5.4).
      #
      # TODO: this endpoint does not exist yet. What it receives is plugins/**/plugin.json plus
      # plugins/**/files/**, and killlist.json. What it owes the client, at
      # <api origin>/plugins/{index,killlist}.json, is:
      #
      #   1. sha512 per artifact, computed from the bytes it received and embedded in the manifest.
      #      Submissions omit the digests deliberately, so the endpoint is the only thing that can
      #      produce them. Without this every install fails its hash check.
      #   2. one document embedding every manifest, so one fetch is one coherent view of the
      #      catalogue and there is no window where the list and its entries disagree.
      #   3. a monotonic `sequence` on each feed, higher than the last published. Clients refuse
      #      anything lower, which is what stops a stale kill-list being replayed to un-revoke a
      #      plugin — the one protection that does not depend on the origin being honest. A counter
      #      that never advances silently turns that check into a no-op.
      #   4. per-plugin artifact URLs the client can fetch over https.
      #
      # Since the feeds are unsigned (§5.1), this endpoint IS the integrity boundary for the
      # catalogue: whatever it serves is what clients believe.
      - name: Upload to the API origin
        if: steps.cfg.outputs.publish == 'true'
        env:
          PUBLISH_URL: ${{ vars.PUBLISH_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          echo "::error::The publish endpoint is not implemented yet. Wire this step to $PUBLISH_URL."
          echo "::error::It must hash the artifacts, embed the manifests, and assign a monotonic"
          echo "::error::sequence — see the comment above this step for the full contract."
          {
            echo "## ❌ Not published"
            echo
            echo "\`PUBLISH_URL\` is set, but this step is still a stub — no upload was attempted."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

          # When this step is implemented it must ALSO append a success block to $GITHUB_STEP_SUMMARY
          # naming what was uploaded and the sequence assigned. Every other outcome of this workflow
          # says plainly what it did; a successful publish should not be the one that stays silent.
