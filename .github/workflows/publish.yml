name: Publish feeds

# Merging is publishing (design doc §5.4). This builds the index and kill-list and uploads them to
# the API origin the app fetches from.
#
# Nothing is signed: this repo's review history is the provenance (§5.1). The consequence is worth
# being explicit about — write access to this repo, or to the publish endpoint, is write access to
# what the marketplace offers. What it does not grant is the ability to alter a plugin's bytes
# without also changing its entry here, because the index pins every artifact by sha512 and clients
# verify before writing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4

      # Which app version? Not `main` — see _app-checkout.md. Validating against unreleased code
      # would accept manifests that every shipped client skips, with a green check to say otherwise.
      - name: Resolve app ref
        id: app
        env:
          APP_REF: ${{ vars.APP_REF }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$APP_REF" ]; then
            echo "ref=$APP_REF" >> "$GITHUB_OUTPUT"
            echo "pinned to $APP_REF via the APP_REF variable"
            exit 0
          fi
          ref="$(gh release view --repo zeraix/zeraix --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$ref" ]; then
            echo "::error::could not resolve the latest zeraix/zeraix release. Set the APP_REF variable to a tag."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "using the latest app release: $ref"

      - name: Checkout app (shared validator + builder + built-in skills)
        uses: actions/checkout@v4
        with:
          repository: zeraix/zeraix
          ref: ${{ steps.app.outputs.ref }}
          path: .app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A missing validator means the app release predates the plugin schema — a MODULE_NOT_FOUND
      # stack trace does not say that, and this is the first thing anyone will hit.
      - name: Check the shared validator is present
        run: |
          if [ ! -f .app/electron/plugins/manifest.mjs ]; then
            echo "::error::${{ steps.app.outputs.ref }} of zeraix/zeraix has no electron/plugins/manifest.mjs."
            echo "::error::That release predates the plugin schema. Ship a release containing it, or set"
            echo "::error::the APP_REF variable to a ref that has it."
            exit 1
          fi

      # Regenerate the built-in skills as zeraix/* plugins. They are gitignored here so there is one
      # copy of each skill (in the app repo) and the two cannot drift.
      - name: Materialize built-in skills
        run: node .app/scripts/export-builtin-skills.mjs --out .

      # Re-check on merged main before anything is uploaded. --allow-reserved because this has just
      # materialized the official built-in skills as plugins/zeraix/*, and the hand-authored official
      # plugins beside them were already reviewed on the way in (validate.yml refuses a reserved
      # publisher from a fork).
      - name: Validate everything
        run: node .github/scripts/validate-submissions.mjs --root . --app .app --allow-reserved

      # Bootstrap vs misconfigured — a distinction worth making, because they deserve opposite
      # outcomes. Before the publish endpoint exists, validation-only is the honest result and a red X
      # on every merge would just train everyone to ignore this workflow.
      - name: Assess publish configuration
        id: cfg
        env:
          PUBLISH_URL: ${{ vars.PUBLISH_URL }}
        run: |
          if [ -z "$PUBLISH_URL" ]; then
            echo "::notice::No publish endpoint configured — validated $(ls -d plugins/*/* 2>/dev/null | wc -l) plugin(s) and stopped."
            echo "::notice::To publish: stand up the endpoint, then set the PUBLISH_URL variable and the"
            echo "::notice::PUBLISH_TOKEN secret. See the README checklist."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # Upload the committed tree. There is no build step: this repo holds plugins as directories,
      # and the endpoint is what turns them into a catalogue (design doc §5.2, §5.4).
      #
      # TODO: this endpoint does not exist yet. What it receives is plugins/**/plugin.json plus
      # plugins/**/files/**, and killlist.json. What it owes the client, at
      # <api origin>/plugins/{index,killlist}.json, is:
      #
      #   1. sha512 per artifact, computed from the bytes it received and embedded in the manifest.
      #      Submissions omit the digests deliberately, so the endpoint is the only thing that can
      #      produce them. Without this every install fails its hash check.
      #   2. one document embedding every manifest, so one fetch is one coherent view of the
      #      catalogue and there is no window where the list and its entries disagree.
      #   3. a monotonic `sequence` on each feed, higher than the last published. Clients refuse
      #      anything lower, which is what stops a stale kill-list being replayed to un-revoke a
      #      plugin — the one protection that does not depend on the origin being honest. A counter
      #      that never advances silently turns that check into a no-op.
      #   4. per-plugin artifact URLs the client can fetch over https.
      #
      # Since the feeds are unsigned (§5.1), this endpoint IS the integrity boundary for the
      # catalogue: whatever it serves is what clients believe.
      - name: Upload to the API origin
        if: steps.cfg.outputs.publish == 'true'
        env:
          PUBLISH_URL: ${{ vars.PUBLISH_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          echo "::error::The publish endpoint is not implemented yet. Wire this step to $PUBLISH_URL."
          echo "::error::It must hash the artifacts, embed the manifests, and assign a monotonic"
          echo "::error::sequence — see the comment above this step for the full contract."
          exit 1
